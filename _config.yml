title: CS Cookbook
description: A practical, topic-first reference for core computer science coding patterns.
url: "https://rapidclock.github.io"
baseurl: ""
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  docs:
    output: true
    permalink: /:path/
defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: doc
      toc: true
  - scope:
      path: ""
    values:
      layout: default
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - vendor
  - node_modules
